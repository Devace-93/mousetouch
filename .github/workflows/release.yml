# Builds release artifacts when a tag like v0.1.0 is pushed:
#   - static binaries (musl) for x86_64 and aarch64, as tarballs
#   - .deb (Debian/Ubuntu/Pop!_OS) and .rpm (Fedora/openSUSE) packages
#   - SHA256SUMS
#   - a Homebrew formula pointing at the tarballs (also pushed to the tap
#     repository when the HOMEBREW_TAP_TOKEN secret is set)
# The version comes from Cargo.toml and must match the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "Cargo.toml says $version but the tag is $tag" >&2
            exit 1
          fi

      - name: Build static binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Package
        run: |
          set -eu
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p target/release dist
          cp target/${{ matrix.target }}/release/mousetouch target/release/mousetouch
          # Tarball: binary + settings app + the files get.sh installs by hand.
          stage=mousetouch-v${version}-${{ matrix.arch }}-linux
          mkdir -p "$stage"
          cp target/release/mousetouch ui/mousetouch-settings "$stage/"
          cp packaging/60-mousetouch.rules packaging/mousetouch.conf \
             packaging/mousetouch.service packaging/io.github.Devace_93.MouseTouch.desktop packaging/io.github.Devace_93.MouseTouch.svg \
             README.md LICENSE "$stage/"
          tar czf "dist/$stage.tar.gz" "$stage"
          # Native packages (the runner's architecture matches the target).
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    env:
      # `secrets` is not allowed in a step `if`, and a step-level env is not
      # visible to that step's own `if`; a job-level env bridges the two.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums and Homebrew formula
        run: |
          set -eu
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          version=$(grep -m1 '^version' ../Cargo.toml | cut -d'"' -f2)
          sha_x86=$(grep "x86_64-linux.tar.gz" SHA256SUMS | cut -d' ' -f1)
          sha_arm=$(grep "aarch64-linux.tar.gz" SHA256SUMS | cut -d' ' -f1)
          sed -e "s/@VERSION@/$version/g" -e "s/@SHA_X86_64@/$sha_x86/g" -e "s/@SHA_AARCH64@/$sha_arm/g" \
              ../packaging/homebrew/mousetouch.rb.in > mousetouch.rb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      - name: Update the Homebrew tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -eu
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Devace-93/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp artifacts/mousetouch.rb tap/Formula/mousetouch.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mousetouch.rb
          git commit -m "mousetouch ${GITHUB_REF_NAME}" || echo "formula unchanged"
          git push

      # The landing page takes the latest version at build time, so just
      # redeploy it (a workflow_dispatch is the one event GITHUB_TOKEN may
      # trigger; the release event it just created does not start workflows).
      - name: Redeploy the landing page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      # The README (and the committed fallback in site/) carry one
      # copy-pasteable command per package with the latest version in it. main
      # only takes pull requests, so update them on a branch, open the PR and
      # merge it right away. Opening PRs needs the repository setting "Allow
      # GitHub Actions to create and approve pull requests"; without it the
      # branch is still pushed and the step prints the compare link instead of
      # failing the release.
      - name: Point the install instructions at this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          branch="install-instructions-${GITHUB_REF_NAME}"
          git fetch --depth=1 origin main
          git checkout -B "$branch" origin/main
          python3 scripts/set-release-version.py "$version"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/index.html README.md
          git commit -m "Install instructions: latest release is ${GITHUB_REF_NAME}" || { echo "instructions already current"; exit 0; }
          git push --force origin "$branch"
          if gh pr create --base main --head "$branch" \
               --title "Install instructions: latest release is ${GITHUB_REF_NAME}" \
               --body "Opened by the Release workflow: scripts/set-release-version.py ${version} over README.md and site/index.html."; then
            gh pr merge "$branch" --merge --delete-branch \
              || echo "::warning::could not merge the pull request; merge it by hand"
          else
            echo "::warning::could not open the pull request; open it by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}"
          fi
