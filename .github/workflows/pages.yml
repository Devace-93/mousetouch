# Publishes site/ (the landing page at https://mouse.3m4.net) to GitHub Pages.
# Runs on every push to main that touches the site, on demand from any branch
# (Actions tab -> "Pages" -> Run workflow) to publish a preview branch, and
# from the Release workflow after each release. The install snippets get the
# latest release's version at build time, so the committed site never needs a
# version bump (what is committed is only the fallback).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Point the install snippets at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp -r site _site
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName || true)
          case "$tag" in
            v[0-9]*) python3 scripts/set-release-version.py "${tag#v}" _site/index.html ;;
            *) echo "::warning::no release found; keeping the committed version" ;;
          esac
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
